<!DOCTYPE HTML>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No viewport meta here on purpose: desktop (Electron) must lay out
         against the window, while mobile needs a fixed logical width. The
         Android host injects its own <meta viewport> at document-start. -->
    <!--
      Clean Dofus Touch game-base bootstrap.

      Served locally by the wrapper over a loopback HTTP server from
      <userData>/game-base/. It fakes the Cordova/Android environment the
      mobile client expects, pulls Ankama's config.json, then loads the
      patched client bundle from ./build/script.js. See game-base/README.md.
    -->
    <!--
      Optional, and only useful when this directory is served by something
      other than the wrapper: a plain HTTP server has no main process, so
      nothing injects window.__dtd and every setting below falls back to its
      default. Drop a settings.js beside this file to supply them:

        window.__dtdSettings = { configUrl: "http://host:port", localMods: true };

      It has to be a blocking script rather than a fetch. The bootstrap at the
      bottom of this head requests config.json while the document is still
      parsing, so anything it reads must already exist by then. A missing
      settings.js is a 404 in the console and nothing else; under the wrapper
      the file is absent and window.__dtd.settings wins regardless.
    -->
    <script src="settings.js"></script>
    <script>
      // --- Environment the mobile client expects -----------------------------
      // (Running under Electron with webSecurity:false, so cross-origin/CORS is
      // handled natively — no fetch proxy needed.)
      // Touch no-op so the client's touch bindings attach cleanly.
      window.ontouchstart = function () {};

      // App identity. The login server rejects a mismatched appVersion
      // (INCOMPATIBLE_APP_VERSION), so use the live App Store version the main
      // process looked up (falls back to a pinned version). buildVersion is
      // overwritten by the client itself once it boots.
      window.appVersion = (window.__dtd && window.__dtd.appVersion) || "3.11.0";
      window.buildVersion = window.appVersion;
      window.appInfo = { version: window.appVersion };
      window._ = {
        appVersion: window.appVersion,
        buildVersion: window.buildVersion,
        client: "android",
      };

      // Render settings (fps/pixelRatio/antialias) read by the patched client
      // bundle (see patches.json), and the wrapper's own keys. Under the
      // wrapper these come from the main process, which resolves fps against
      // the monitor's refresh rate and reads <userData>/settings.json. Served
      // any other way there is no main process, so a settings.js loaded above
      // gets its turn before the defaults.
      //
      // This is the one object the rest of the page and the mods read, so a
      // setting means the same thing whichever host supplied it.
      window.__dtdSettings = (window.__dtd && window.__dtd.settings) ||
        window.__dtdSettings || {
          fps: 60,
          pixelRatio: 2,
          antialias: true,
        };

      // Chromium defines window.indexedDB as a read-only accessor, so the
      // assignment that used to sit here replaced nothing: the client has
      // always run on the real IndexedDB. These four are ordinary writable
      // globals, and the bundle only reads IDBTransaction.READ_ONLY /
      // READ_WRITE off them, so they stay stubbed.
      window.IDBDatabase = {};
      window.IDBTransaction = {};
      window.IDBCursor = {};
      window.IDBKeyRange = {};

      // The client's disk cache kills the whole app when its IndexedDB open()
      // fails: "Error IDB01" (ui.fatal.idb). The usual cause is a store left
      // half-written by a hard kill. Catch the failing request and let the
      // host empty this window's store and reload. The host repairs once per
      // window; after that this reports and the client shows its own error,
      // which is the behaviour there was before.
      (function () {
        var idb = window.indexedDB;
        if (!idb || typeof idb.open !== "function") return;
        var open = idb.open.bind(idb);
        var reported = false;
        function report(why) {
          if (reported) return;
          reported = true;
          console.error("[dtd] IndexedDB " + why);
          if (window.__dtd && window.__dtd.idbFailed) window.__dtd.idbFailed(why);
        }
        idb.open = function () {
          var req = open.apply(null, arguments);
          req.addEventListener("error", function () {
            report("open error: " + ((req.error && req.error.message) || "unknown"));
          });
          // No onblocked handler in the client: an open held up by another
          // connection hangs the boot instead of failing it.
          req.addEventListener("blocked", function () { report("open blocked"); });
          return req;
        };
      })();

      // Minimal Cordova environment for the Cordova-built client, and only
      // when a host is present — because defining it is also a claim about how
      // this page is able to log in. The client picks its login flow from what
      // it finds here, and window.cordova sends it down the Cordova one: the
      // login URL goes to a browser tab the host opens, and the redirect comes
      // back on a custom scheme that only a host can intercept.
      //
      // Served by a plain HTTP server there is no host to do either, and the
      // client's own browser flow — navigate to the login page, come back to
      // this URL with ?code= — is the one that works. Leaving cordova
      // undefined is what selects it.
      //
      // The rest of the client copes with the absence: audio, screen
      // orientation and the WebView selector each test for their plugin before
      // touching it, and isCordova is only ever read as a boolean.
      if (window.__dtd) {
      window.cordova = {
        plugins: {
          isemulator: { assess: function (fct) { fct(false); } },
          Keyboard: {
            close: function () {},
            disableScroll: function () {},
            show: function () {},
            hideKeyboardAccessoryBar: function () {},
          },
          notification: { local: false },
          pushNotification: {
            onDeviceReady: function () {},
            setUserId: function () {},
            registerDevice: function () {},
          },
          // The client opens the Ankama OAuth URL through browsertab. Bridge
          // it to a native auth window via the platform preload (window.__dtd).
          browsertab: {
            isAvailable: function (cb) {
              cb(true);
            },
            openUrl: function (url) {
              if (window.__dtd) window.__dtd.openAuth(url);
              else console.error("[dtd] __dtd bridge missing");
            },
            close: function () {
              if (window.__dtd) window.__dtd.closeAuth();
            },
          },
        },
      };

      // The client registers a deeplink callback via IonicDeeplink to receive
      // the OAuth redirect (dofustouch://authorized?code=...). We store the
      // callback and invoke it from Rust once the auth window captures the
      // redirect (see window.__dtd_onAuthRedirect below).
      window.IonicDeeplink = {
        onDeepLink: function (cb) {
          window.__dtd_deeplinkCb = cb;
        },
        route: function () {},
        routeWithNavController: function () {},
      };
      }

      // Called by Rust (via eval) when the auth window captures the redirect.
      // The client's deeplink callback reads e.host, e.path, e.queryString and
      // e.url (it parses queryString for `code`), so build that exact shape.
      // For dofustouch://authorized?code=XXX -> host="authorized",
      // path="", queryString="code=XXX".
      window.__dtd_onAuthRedirect = function (url) {
        try {
          console.log("[dtd] auth redirect received:", url);
          var m = /^([^:]+):\/\/([^/?#]*)([^?#]*)(?:\?([^#]*))?/.exec(url) || [];
          var match = {
            url: url,
            scheme: m[1] || "",
            host: m[2] || "",
            path: m[3] || "",
            queryString: m[4] || "",
          };
          console.log("[dtd] deeplink match:", JSON.stringify(match));
          var cb = window.__dtd_deeplinkCb;
          if (cb) cb(match);
          else console.warn("[dtd] no deeplink callback registered yet");
        } catch (e) {
          console.error("[dtd] deeplink callback error", e);
        }
      };

      // NOTE: we deliberately do NOT override requestAnimationFrame. An earlier
      // approach throttled it to ~60fps via setTimeout to tame WKWebView on macOS, but
      // Electron/Chromium's native rAF is vsync-locked to the monitor's refresh
      // rate — so the game renders at the display's framerate (60/120/144Hz).

      // Where the client's config.json comes from. Ankama's host unless a
      // `configUrl` says otherwise.
      //
      // The override has to be resolved here rather than in a mod: this fetch
      // fires while the document is still parsing, before mods.js has loaded,
      // so nothing loaded later can intercept it.
      var CONFIG_HOST = window.__dtdSettings.configUrl || "";
      var CONFIG_URL = CONFIG_HOST
        ? CONFIG_HOST.replace(/\/+$/, "") + "/config.json"
        : "https://dt-proxy-production-login.ankama-games.com/config.json";

      // Loads the patched client bundle, then our runtime fixes, then cb().
      window.initDofus = function (cb) {
        var head = document.getElementsByTagName("head")[0];
        var client = document.createElement("script");
        client.addEventListener("load", function () {
          var fixes = document.createElement("script");
          fixes.src = "fixes.js";
          head.appendChild(fixes);
          if (cb) cb();
        });
        client.addEventListener("error", function () {
          document.body.innerHTML =
            '<pre style="color:#f66;font:14px monospace;padding:16px">' +
            "[dtd] build/script.js missing.\n\nThe client bundle has not been " +
            "provisioned yet. Set the client build URL in config.json " +
            '(client_build_url) so the wrapper can download + patch it.</pre>';
        });
        client.src = "build/script.js";
        head.appendChild(client);
      };

      // Fetch config first (the client reads window.Config), then boot.
      fetch(CONFIG_URL)
        .then(function (r) { return r.json(); })
        .then(function (cfg) {
          // The client decides this inside its own config loader, which is
          // skipped by assigning window.Config here. It is what makes the art
          // be requested with crossOrigin="anonymous", and without it an
          // assets host on another origin taints the WebGL canvas: every
          // texture upload fails with a SecurityError and the map never draws.
          // Same rule the client applies — anonymous unless the URL carries
          // credentials of its own.
          if (cfg && cfg.imgCrossOrigin === undefined) {
            cfg.imgCrossOrigin = /^https?:\/\/.+?:.+?@.+?/.test(cfg.assetsUrl || "")
              ? undefined
              : "anonymous";
          }
          window.Config = cfg;
          window.initDofus(function () {});
        })
        .catch(function (e) {
          document.body.innerHTML =
            '<pre style="color:#f66;font:14px monospace;padding:16px">' +
            "[dtd] failed to load config.json from " + CONFIG_URL + "\n\n" +
            String(e) + "</pre>";
        });
    </script>
    <link rel="stylesheet" href="build/styles-native.css" />
    <link rel="stylesheet" href="fixes.css" />
  </head>
  <body></body>
  <script src="keymaster.js"></script>
  <script src="mods.js"></script>
</html>
